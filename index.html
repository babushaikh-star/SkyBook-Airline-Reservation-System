<!DOCTYPE html>
<html>
<head>

    <title>SkyBook Airline</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        ✈ SkyBook
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/login">Admin</a>

    </div>

</nav>

<div class="hero">

    <div class="search-box">

        <h1>Search Your Flight</h1>

        <form action="/search" method="POST">

            <input type="text"
                   name="from_city"
                   placeholder="From City"
                   required>

            <input type="text"
                   name="to_city"
                   placeholder="To City"
                   required>

            <button type="submit">

                Search Flights

            </button>

        </form>

    </div>

</div>

</body>
</html>
