<!DOCTYPE html>
<html>
<head>

    <title>User Register</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='style.css') }}">

</head>

<body>

<div class="login-box">

    <h1>Create Account</h1>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Full Name"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">

            Register

        </button>

    </form>

    <p>

        Already have account?

        <a href="/user_login">

            Login

        </a>

    </p>

</div>

</body>
</html>
