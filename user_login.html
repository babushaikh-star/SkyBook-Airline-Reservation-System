<!DOCTYPE html>
<html>
<head>

    <title>User Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='style.css') }}">

</head>

<body>

<div class="login-box">

    <h1>User Login</h1>

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">

            Login

        </button>

    </form>

    <p class="error">

        {{ error }}

    </p>

    <p>

        Create new account

        <a href="/register">

            Register

        </a>

    </p>

</div>

</body>
</html>
